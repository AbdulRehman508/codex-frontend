<form action="/" [formGroup]="forgotForm">
    @if (!sent()) {
    <div>
        <p class="mb-1">{{ 'common.email' | t }}</p>
        <input type="email" formControlName="email" [placeholder]="'common.email' | t"
            [ngClass]="{ _inputError: submitted && forgotForm.controls['email'].invalid }">
    </div>
    <div class="mt-5 form-group text-right d-flex align-items-center justify-content-between">
        <ng-container *ngTemplateOutlet="backToLogin"></ng-container>
        <button class="_primary-btn" type="button" [disabled]="loading()" (click)="resetPassword()">{{ loading() ? 'Sending...' : 'Continue' }}</button>
    </div>
    } @else {
    <p class="text-center mb-4">{{ 'auth.resetSent' | t }}</p>
    <div class="text-center">
        <ng-container *ngTemplateOutlet="backToLogin"></ng-container>
    </div>
    }
</form>
<ng-template #backToLogin>
    <a href="javascript:void(0)" class="f-12 primary-color text-decoration-none" (click)="moveLogin()">
        <i class="pi pi-arrow-left f-10 mr-1"></i> {{ 'auth.backToLogin' | t }}
    </a>
</ng-template>
