<div class="auth-page">
    <!-- a quiet brand wash behind the card, so the first screen is not a
         white rectangle on a white page -->
    <div class="auth-glow" aria-hidden="true"></div>

    <div class="auth-card">
        <div class="auth-brand">
            <img src="assets/logo/logo.png" alt="Code-X" />
        </div>

        <div class="auth-head">
            <h1>{{ forgot_password_visible ? ('login.forgot' | t) : ('login.title' | t) }}</h1>
            @if (!forgot_password_visible) {
            <p>{{ 'login.subtitle' | t }}</p>
            }
        </div>

        @if (!forgot_password_visible) {
        <form action="/" [formGroup]="loginForm">
            <div class="auth-field">
                <label for="login-email">{{ 'login.email' | t }}</label>
                <input id="login-email" type="email" formControlName="email" autocomplete="username"
                    [placeholder]="'login.email' | t"
                    [ngClass]="{ _inputError: submitted && loginForm.controls['email'].invalid }">
            </div>

            <div class="auth-field position-relative">
                <label for="login-password">{{ 'login.password' | t }}</label>
                <input id="login-password" [type]="password_visible ? 'password' : 'text'"
                    formControlName="password" autocomplete="current-password" placeholder="••••••••"
                    [ngClass]="{ _inputError: submitted && loginForm.controls['password'].invalid }">
                <i class="pi {{password_visible ? 'pi-eye-slash' : 'pi-eye'}} password-icon"
                    (click)="password_visible=!password_visible"></i>
            </div>

            <div class="auth-row">
                <label class="auth-remember">
                    <input class="form-check-input" type="checkbox" formControlName="remember_me">
                    <span>{{ 'login.remember' | t }}</span>
                </label>
                <a href="javascript:void(0)" class="auth-link" (click)="forgot_password_visible = true">
                    {{ 'login.forgot' | t }}
                </a>
            </div>

            <button class="_primary-btn auth-submit" type="button" [disabled]="loading()" (click)="submitForm()">
                {{ loading() ? ('login.signingIn' | t) : ('login.submit' | t) }}
            </button>
        </form>
        } @else {
        <app-forgot-password (moveToLogin)="showLogin($event)"></app-forgot-password>
        }
    </div>

    <p class="auth-foot">Code-X · {{ 'login.tagline' | t }}</p>
</div>
