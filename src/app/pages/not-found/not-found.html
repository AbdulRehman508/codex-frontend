<div class="nf">
    <p class="nf-code">404</p>
    <h1>{{ 'notFound.title' | t }}</h1>
    <p class="nf-text">
        {{ 'notFound.body' | t }}
    </p>
    <div class="nf-actions">
        <button type="button" class="_cancel-btn" (click)="back()">{{ 'notFound.goBack' | t }}</button>
        <a class="_primary-btn" [routerLink]="homeLink">
            {{ homeLink === '/login' ? 'Sign in' : 'Dashboard' }}
        </a>
    </div>
</div>
